name: CI

on:
  push:
    branches: ["init/architecture"]
  pull_request:
    branches: ["init/architecture"]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: Install dependencies (workspaces aware)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --workspaces
          else
            npm install --workspaces
          fi

      - name: Generate Prisma client (if schema present)
        run: |
          if [ -f backend/prisma/schema.prisma ]; then
            echo "Prisma schema found — generating client"
            cd backend
            npx prisma generate
          else
            echo "No Prisma schema found — skipping prisma generate"
          fi

      - name: Run lint (if available)
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script defined, skipping"
          fi

      - name: Run typecheck (if available)
        run: |
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            echo "No typecheck script defined, skipping"
          fi

      - name: Run tests (if available)
        run: |
          if npm run | grep -q "test"; then
            npm run test
          else
            echo "No test script defined, skipping"
          fi

      - name: Run build (if available)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script defined, skipping"
          fi
