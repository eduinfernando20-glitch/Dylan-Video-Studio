name: CI

on:
  push:
    branches: ["init/architecture"]
  pull_request:
    branches: ["init/architecture"]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Use npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-

      - name: Install dependencies (workspaces aware)
        run: |
          if [ -f package-lock.json ] ; then
            npm ci --workspaces
          else
            npm install --workspaces
          fi

      - name: Generate Prisma client (if schema present)
        run: |
          if [ -f backend/prisma/schema.prisma ]; then
            echo "Prisma schema found — generating client"
            (cd backend && npx prisma generate)
          else
            echo "No Prisma schema found — skipping prisma generate"
          fi

      - name: Typecheck
        run: |
          npm run typecheck

      - name: Run tests
        run: |
          npm run test

      - name: Build
        run: |
          npm run build
